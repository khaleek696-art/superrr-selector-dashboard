name: Keep App Awake

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud App
        run: |
          URL="https://superrr-selector-dashboard.streamlit.app"
          echo "Pinging $URL..."
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || true)
          echo "Response HTTP Status: $STATUS"
